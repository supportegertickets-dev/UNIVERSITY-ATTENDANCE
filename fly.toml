app = "university-attendance"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  PORT = "3000"

[mounts]
  source = "data"
  destination = "/data"
